name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: cd launcher && chmod +x gradlew && ./gradlew assembleRelease -q
      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: launcher/app/build/outputs/apk/release/*.apk
